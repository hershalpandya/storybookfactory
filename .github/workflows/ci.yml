name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/projects/
            !/reports/
            !/local-references/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.17'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest

  grype:
    name: Grype dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/projects/
            !/reports/
            !/local-references/
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: 'v0.122.1'
      - name: Scan locked dependencies
        env:
          GRYPE_BIN: ${{ steps.grype.outputs.cmd }}
          GRYPE_REPORT: ${{ runner.temp }}/grype.json
        run: '"$GRYPE_BIN" dir:. --fail-on high --output table --output "json=$GRYPE_REPORT"'
      - name: Save scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-report
          path: ${{ runner.temp }}/grype.json
          if-no-files-found: ignore
          retention-days: 14
