[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storybook-toolkit"
version = "0.1.0"
description = "Tools for creating reviewed illustrated storybooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=13.0.0", "reportlab>=4"]
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "src/storybook_toolkit/fonts/LICENSE"]

[project.scripts]
storybook = "storybook_toolkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/storybook_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
